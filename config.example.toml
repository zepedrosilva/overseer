# Overseer Configuration File
# Save locally as ./config.toml (project-specific) or ~/.config/overseer/config.toml (global)

[defaults]
agent = "claude"              # Default agent: "claude", "gemini", "pi", or custom defined agent
poll_interval_secs = 90       # Seconds between poll cycles
worktrees_dir = "./.overseer/worktrees" # Local worktree directory for CLI agent runs
# Optional: customize GitHub PR search query (defaults to "is:pr is:open involves:@me")
# search_query = "is:pr is:open involves:@me"

# Dynamic PR Discovery:
# If [[repos]] is omitted or empty, Overseer automatically monitors all open PRs
# involving you across all GitHub repositories accessible to your `gh` CLI.

# Monitored Repositories (Optional - only needed if you want to restrict/target specific repos)
# [[repos]]
# url = "https://github.com/owner/repo1"
# agent = "agy"                 # Per-repo agent override (optional)

# Custom Agent Definitions (Optional)
# Supports placeholders: {pr}, {branch}, {owner}, {repo}, {url}, {worktree}
[agents.custom-reviewer]
command = "agy review --branch {branch} --pr {pr}"
description = "Custom Antigravity review command"

[agents.my-claude-fixer]
command = "claude -p 'Fix the review comments on PR #{pr}'"
description = "Claude CLI automated remediation"

# Runtime Overrides
[runtime]
dry_run = false               # If true, logs actions without performing them

# Stream Deck Integration (Optional, disabled by default)
[streamdeck]
enabled = false               # Set to true to start HTTP/SSE server on port 3210
port = 3210
